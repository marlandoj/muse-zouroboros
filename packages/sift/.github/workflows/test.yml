name: Test Sift
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
      - run: python3 -m pip install -r requirements-install.txt
      - run: python3 -m unittest discover -s test -v
      - run: bun test/native.mjs
