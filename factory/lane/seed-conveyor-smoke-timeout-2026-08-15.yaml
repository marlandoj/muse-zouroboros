goal: >-
  Preserve the conveyor smoke gate's bounded execution while preventing transient
  pool-probe timeouts from being misreported as child assertion failures.
constraints:
  - Work only in an isolated clean worktree.
  - Do not mutate production state, runtime flags, Linear records, holds, or dispatch state.
  - Do not retry the pool probe blindly.
  - Keep the pool timeout finite and scoped to the pool self-test call site.
  - Do not invoke model-based MoA or a model Consensus Gate.
  - Open a reversible pull request and do not merge it automatically.
acceptance_criteria:
  - A regression test proves timeout evidence takes precedence over captured stdout.
  - Timeout, signal-only termination, and non-timeout spawn errors are reported explicitly.
  - The pool self-test timeout is increased from 30 seconds to 60 seconds and remains finite.
  - Focused tests and strict TypeScript pass with zero errors.
  - The full hermetic conveyor smoke test reports HEALTHY.
  - Constitutional verification, post-flight evaluation, and the five-part gap audit pass.
