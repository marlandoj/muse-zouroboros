scenario_id: credential-absence
description: Zo provider credential absence fails closed before any provider call.
seed: 101
steps:
  - name: missing-credential
    run: >-
      env -u ZO_CLIENT_IDENTITY_TOKEN -u ZO_API_KEY bun -e
      'import { resolvePersonaZoAskAuthorization } from "{scripts_dir}/persona-orchestrator.ts";
      try { resolvePersonaZoAskAuthorization(); } catch (e) { console.error(`FATAL: ${e.message}`); process.exit(2); }'
    timeout_ms: 15000
    expect:
      exit_code: 2
      stderr_contains: ["FATAL: ZO_CLIENT_IDENTITY_TOKEN or ZO_API_KEY not set"]
